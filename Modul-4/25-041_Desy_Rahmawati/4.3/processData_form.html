
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registration Soal 1</title>

    <style>
        fieldset {
            background-color: #DBEA;
            padding: 5px 10px;
            font-weight: bold;
            border-radius: 4px;
        }

        .field {
            display: flex;
            align-items: center;
            margin-bottom: 7px;
        }

        .field label {
            width: 120px;
        }

    </style>
</head>

<body>
    <h1>Register</h1>

    <fieldset>
        <legend><h2>Personal Details</h2></legend>

        <form name="myForm" action="processData.php" method="POST">

            <div class="field">
                <label for="surname">Surname</label>
                <input type="text" id="surname" name="surname" size="31">
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="text" id="email" name="email" size="31">
            </div>

            <div class="field">
                <label for="passwd">Password</label>
                <input type="password" id="passwd" name="passwd" size="31">
            </div>

            <div class="field">
                <label for="address">Street Address</label>
                <textarea id="address" name="address" rows="3" cols="30"></textarea>
            </div>

            <div class="field">
                <label for="state">State</label>
                <select id="state" name="state">
                    <option value="-1" selected>[Choose your state]</option>
                    <option value="1">Australian Capital Territory</option>
                    <option value="2">Queensland</option>
                    <option value="3">Victoria</option>
                    <option value="4">New South Wales</option>
                    <option value="5">Tasmania</option>
                    <option value="6">South Australia</option>
                    <option value="7">Western Australia</option>
                    <option value="8">Northern Territory</option>
                </select>
            </div>

            <div class="field">
                <input type="hidden" name="country" value="Australia">
            </div>

            <div class="field">
                <label>Gender</label>

                <input type="radio" id="male" name="sex" value="Male">
                <label for="male" style="width: auto;">Male</label>

                <input type="radio" id="female" name="sex" value="Female">
                <label for="female" style="width: auto;">Female</label>
            </div>

            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <input type="checkbox" id="vegetarian" name="vegetarian" value="Yes">
            </div>

            <div class="field">
                <label></label>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>

        </form>
    </fieldset>
</body>
</html>
