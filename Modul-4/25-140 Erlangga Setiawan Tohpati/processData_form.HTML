<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TP Modul 4</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #ffffff;
            margin: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        fieldset {
            background-color: #e6e6fa; 
            border: 1px solid #a0a0a0;
            padding: 20px;
            width: 500px;
            box-sizing: border-box;
        }

        legend {
            font-weight: bold;
            font-size: 16px;
            padding: 0 5px;
        }

        .field {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .field label {
            width: 140px;
            text-align: right;
            padding-right: 15px;
            font-weight: bold;
            font-size: 14px;
            line-height: 24px;
        }

        .field input[type="text"],
        .field input[type="password"],
        .field textarea,
        .field select {
            width: 220px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 13px;
            border: 1px solid #7f9db9;
            padding: 2px;
        }

        .field textarea {
            height: 50px;
            resize: vertical;
        }

        .field-options {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            line-height: 24px;
        }

        .field-options label {
            width: auto;
            text-align: left;
            padding-right: 10px;
            font-weight: normal;
        }

        .button-group {
            margin-left: 155px; 
            margin-top: 10px;
        }

        .button-group input {
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Register</h1>
    <fieldset>
        <legend>Person Details</legend>
        <form name="myForm" action="processData.php" method="POST">
            <div class="field">
                <label for="surname">Surname</label>
                <input type="text" id="surname" name="surname" value="Smith" />
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="text" id="email" name="email" value="j.smith@gmail.com" />
            </div>
            <div class="field">
                <label for="passwd">Password</label>
                <input type="password" id="passwd" name="passwd" value="123456" />
            </div>
            <div class="field">
                <label for="address">Street Address</label>
                <textarea id="address" name="address" rows="3" cols="22">126 Margaret Street
Brisbane 4000</textarea>
            </div>
            <div class="field">
                <label for="state">State</label>
                <select id="state" name="state">
                    <option value="-1">[choose your state]</option>
                    <option value="1">Australian Capital Territory</option>
                    <option value="2" selected>Queensland</option>
                    <option value="3">Victoria</option>
                    <option value="4">New South Wales</option>
                    <option value="5">Tasmania</option>
                    <option value="6">South Australia</option>
                    <option value="7">Western Australia</option>
                    <option value="8">Northern Territory</option>
                </select>
            </div>
            <input type="hidden" name="country" value="Australia" />
            <div class="field">
                <label for="sex">Gender</label>
                <div class="field-options">
                    <input type="radio" id="male" name="sex" value="male" checked />
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="sex" value="female" />
                    <label for="female">Female</label>
                </div>
            </div>
            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <div class="field-options">
                    <input type="checkbox" id="vegetarian" name="vegetarian" />
                </div>
            </div>
            <div class="button-group">
                <input type="submit" value="Submit" name="submit" />
                <input type="reset" value="Reset" name="reset" />
            </div>
        </form>
    </fieldset>
</body>
</html>
