<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        fieldset {
            width: 450px; 
            padding: 20px;
        }
        legend {
            font-weight: bold;
            font-size: 1.1em;
        }
        .field {
            margin-bottom: 8px; 
        }

        .field label:first-child {
            display: inline-block;
            width: 140px; 
            text-align: right;
            margin-right: 10px;
        }
       
        .tombol {
            margin-left: 155px; 
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <fieldset>
        <legend>Person Details</legend>
        <form name="myform" action="processData.php" method="POST">
            <div class="field">
                <label for="surname">Surname</label>
                <input type="text" name="surname" size="31" />
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="text" name="email" size="31" />
            </div>
            <div class="field">
                <label for="passwd">Password</label>
                <input type="password" name="passwd" size="31" />
            </div>
            <div class="field">
                <label for="address">Street Address</label>
                <textarea name="address" rows="3" cols="22"></textarea>
            </div>
            <div class="field">
                <label for="state">State</label>
                <select name="state">
                    <option value="-1" selected>[choose your state]</option>
                    <option value="1">Australian Capital Territory</option>
                    <option value="2">Queensland</option>
                    <option value="3">Victoria</option>
                </select>
            </div>
            <div class="field">
                <input type="hidden" name="country" value="Australia">
            </div>
            <div class="field">
                <label>Gender</label>
                <input type="radio" name="sex" value="male"> Male
                <input type="radio" name="sex" value="female"> Female
            </div>
            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <input type="checkbox" name="vegetarian">
            </div>
            <div class="field tombol">
                <input type="submit" value="Submit" name="submit" />
                <input type="reset" value="Reset" name="reset" />
            </div>
        </form>
    </fieldset>
</body>
</html>
